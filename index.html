<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>V4A9-18</title>
<meta name="description" content="classified">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Mrs+Saint+Delafield&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- noise / scanline overlay, purely decorative -->
<div class="grain" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<!-- ============================================================
     BOOT SEQUENCE
============================================================= -->
<section id="boot" class="boot" aria-label="loading">
  <div class="boot-inner">
    <pre id="bootLog" class="boot-log"></pre>
    <div class="boot-bar-track" aria-hidden="true">
      <div id="bootBar" class="boot-bar"></div>
    </div>
  </div>
  <button id="skipBoot" class="skip-btn" type="button">skip</button>
</section>

<!--
  FAILSAFE — independent of script.js, so it works even if the main
  script fails to load or throws an error. If the boot sequence hasn't
  finished within a few seconds, this reveals a manual way in.
  Nothing to edit here.
-->
<script>
  (function () {
    window.__v4a9Ready = false;
    window.addEventListener("error", function (e) {
      console.error("V4A9 runtime error:", e.message, "at", e.filename + ":" + e.lineno);
    });
    setTimeout(function () {
      if (window.__v4a9Ready) return;
      var boot = document.getElementById("boot");
      if (!boot || boot.hidden) return;
      var inner = boot.querySelector(".boot-inner");
      var note = document.createElement("p");
      note.style.cssText = "margin-top:24px;font-family:monospace;font-size:12px;color:#8A8D92;";
      note.innerHTML = 'something stalled loading the main script — <a href="#" id="failsafeLink" style="color:#E8A33D;text-decoration:underline;">click here to continue anyway</a>';
      inner.appendChild(note);
      document.getElementById("failsafeLink").addEventListener("click", function (ev) {
        ev.preventDefault();
        boot.hidden = true;
        var gate = document.getElementById("gate");
        var site = document.getElementById("site");
        if (gate) gate.hidden = false;
        else if (site) site.hidden = false;
      });
    }, 3500);
  })();
</script>

<!-- ============================================================
     LANDING GATE
============================================================= -->
<section id="gate" class="gate" hidden>
  <div class="gate-inner">
    <p class="gate-kicker">FILE // V4A9-18</p>
    <h1 class="gate-title">V4A9-18</h1>
    <p class="gate-subtitle" id="gateSubtitle">an unnecessarily elaborate birthday project</p>
    <button id="enterBtn" class="enter-btn" type="button">
      <span class="enter-btn-label">open file</span>
      <span class="enter-btn-caret">_</span>
    </button>
    <p class="gate-footnote">you were not supposed to find this link. since you did — sit down.</p>
  </div>
</section>

<!-- ============================================================
     CELEBRATION
============================================================= -->
<div id="site" class="site" hidden>

  <div class="celebration">
    <p class="celebration-kicker" id="celKicker">FILE DECRYPTED</p>
    <h1 class="celebration-title" id="celTitle">Happy Birthday</h1>
    <p class="celebration-sub" id="celSub">one more trip around the sun.</p>

    <button id="celebrateBtn" class="celebrate-btn" type="button">celebrate again</button>

    <div id="envelopeBackdrop" class="envelope-backdrop" aria-hidden="true"></div>

    <div class="envelope-wrap">
      <button id="envelopeBtn" class="envelope" type="button" aria-expanded="false" aria-label="open the envelope">
        <span class="envelope-flap"></span>
        <span class="envelope-body"></span>
        <span class="envelope-seal">✦</span>
        <div class="envelope-letter" id="envelopeLetter">
          <p id="envelopeMessage"></p>
        </div>
      </button>
      <p class="envelope-hint" id="envelopeHint">tap to open</p>
    </div>
  </div>

  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
</div>

<script src="script.js"></script>
</body>
</html>
